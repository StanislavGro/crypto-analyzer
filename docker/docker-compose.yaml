version: '3'

services:
  postgres:
    image: postgres:14
#    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_INPUT_PORT}:${POSTGRES_OUTPUT_PORT}
