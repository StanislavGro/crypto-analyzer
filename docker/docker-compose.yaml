version: '3'

services:

  portfolio-service:
    image: registry.hub.docker.com/stanislavskii/portfolio-service
#    restart: always
    expose:
      - "8010"
    depends_on:
      - postgres
    environment:
      - "DB_HOST=postgres"
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "SERVER_PORT=${PORTFOLIO_SERVICE_PORT}"

  postgres:
    container_name: postgres
    image: postgres:14
#    restart: always
    shm_size: 128mb
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
