name: Crypto Analyzer CI/CD

on:
  push:
    branches:
      - 'feature-*'
  pull_request:
    branches:
      - '*'

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Login runner to Docker Registry
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
        run: |
          echo "$DOCKER_REGISTRY_PASSWORD" | docker login -u "$DOCKER_REGISTRY_USER" --password-stdin 

      - name: Build and push with JIB
        run: |
          cd java
          ./mvnw compile jib:build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.IP_ADDRESS }} >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Copy files to remote server
        env:
          USERNAME: ${{ secrets.USERNAME }}
          IP_ADDRESS: ${{ secrets.IP_ADDRESS }}
        run: |
          ssh -o StrictHostKeyChecking=no $USERNAME@$IP_ADDRESS "mkdir -p /crypto-analyzer/docker"
          scp -r ./deploy/docker $USERNAME@$IP_ADDRESS:/crypto-analyzer

      - name: Creating .evn file
        env:
          USERNAME: ${{ secrets.USERNAME }}
          IP_ADDRESS: ${{ secrets.IP_ADDRESS }}
        run: |
          ssh -o StrictHostKeyChecking=no $USERNAME@$IP_ADDRESS << 'EOF'
            cd /crypto-analyzer/docker
            cat > .env << 'INNER_EOF'
          TAG=latest

          PORTFOLIO_SERVICE_EXTERNAL_PORT=9000
          PORTFOLIO_SERVICE_INTERNAL_PORT=8080
          
          POSTGRES_DB=crypto-analyzer
          POSTGRES_USER=crypto
          POSTGRES_PASSWORD=crypto
          POSTGRES_EXTERNAL_PORT=5435
          POSTGRES_INTERNAL_PORT=5432
          INNER_EOF
          EOF

      - name: Starting Docker Compose
        env:
          USERNAME: ${{ secrets.USERNAME }}
          IP_ADDRESS: ${{ secrets.IP_ADDRESS }}
        run: |
          ssh $USERNAME@$IP_ADDRESS << 'EOF'
            cd /crypto-analyzer/docker
            docker-compose -f docker-compose.local.yaml up -d >> deploy.log 2>&1 || {
              echo "[ERROR] Failed to start Docker Compose" >> deploy.log
              exit 1
            }
            echo "[OK] Docker Compose successfully deployed" >> deploy.log
          EOF

      - name: Copying log file on server
        if: always()
        env:
          USERNAME: ${{ secrets.USERNAME }}
          IP_ADDRESS: ${{ secrets.IP_ADDRESS }}
        run: |
          scp $USERNAME@$IP_ADDRESS:/crypto-analyzer/docker/deploy.log ./deploy.log || true
          cat deploy.log
