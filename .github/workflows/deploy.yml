name: Crypto Analyzer CI/CD

on:
  push:
    branches:
      - 'feature-*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installing JDK-21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: temurin

      - name: Packaging with Maven
        run: mvn -f java/pom.xml clean install -DskipTests -B

#      - name: Debug built files
#        run: ls -lah java/portfolio-service/target

      - name: Upload Maven artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-analyzer
          path: java/portfolio-service/target/*.jar
          compression-level: '0'

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Ensure artifact directory exists
        run: mkdir -p ./app

      - name: Artifact downloading
        uses: actions/download-artifact@v4
        with:
          name: crypto-analyzer
          path: ./app

#      - name: Debug downloaded artifact
#        run: ls -lah ./app

      - name: Server link and env setting up
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          
          # Отключаем проверку ключа хоста
          ssh -o StrictHostKeyChecking=no -i private_key $SERVER_USER@$SERVER_IP "echo 'SSH Connected!'"
          
          # Установка Docker, если его нет
          if ! command -v docker &> /dev/null; then
            echo "Docker не найден, устанавливаем..."
            sudo apt update || { echo "Ошибка обновления apt"; exit 1; }
            sudo apt install -y docker.io || { echo "Ошибка установки Docker"; exit 1; }
            sudo systemctl enable docker || { echo "Ошибка включения Docker"; exit 1; }
            sudo systemctl start docker || { echo "Ошибка запуска Docker"; exit 1; }
          else
            echo "Docker уже установлен."
          fi
          
          # Проверка установки Docker
          docker --version || { echo "Docker не установлен."; exit 1; }
          
          # Установка Docker Compose, если его нет
          if ! command -v docker-compose &> /dev/null; then
            echo "Docker Compose не найден, устанавливаем..."
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose || { echo "Ошибка загрузки Docker Compose"; exit 1; }
            sudo chmod +x /usr/local/bin/docker-compose || { echo "Ошибка изменения прав Docker Compose"; exit 1; }
          else
            echo "Docker Compose уже установлен."
          fi
          
          # Проверка установки Docker Compose
          docker-compose --version || { echo "Docker Compose не установлен."; exit 1; }

      - name: Debug downloaded artifact
        run: ls -R

      - name: Debug server details
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo "Server user: $SERVER_USER"
          echo "Server IP: $SERVER_IP"

      - name: Копирование файлов на сервер
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          scp -i private_key -r . $SERVER_USER@$SERVER_IP:/home

      - name: Запуск контейнера с Docker Compose
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -i private_key $SERVER_USER@$SERVER_IP << EOF
          cd /home
          docker-compose down || true
          docker-compose up --build -d
          EOF
