server:
  port: 8080
#  error:
#    whitelabel:
#      enabled: false

spring:
  application:
    name: portfolio-service
  datasource:
    url: jdbc:postgresql://localhost:5433/crypto-analyzer
    driver-class-name: org.postgresql.Driver
    username: crypto
    password: crypto
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    database-change-log-table: portfolio_service_databasechangelog
    database-change-log-lock-table: portfolio_service_databasechangeloglock
  jpa:
    hibernate:
      ddl-auto: none
  main:
    banner-mode: off
